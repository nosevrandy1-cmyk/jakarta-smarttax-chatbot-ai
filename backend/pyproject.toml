[project]
name = "jakarta-smarttax-chatbot-ai-backend"
version = "1.0.0"
description = "Jakarta SmartTax Chatbot AI Backend — FastAPI, SQLite, Qdrant Vector DB, and Multi-Node Ollama (Gemma 2 & DeepSeek)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "ollama>=0.4.7",
    "qdrant-client>=1.12.0",
    "transformers>=4.44.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
]
