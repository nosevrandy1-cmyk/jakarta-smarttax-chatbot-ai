[project]
name = "jakarta-smarttax-chatbot-ai-backend"
version = "1.0.0"
description = "Jakarta SmartTax Chatbot AI Backend — FastAPI, SQLite, Qdrant Vector DB, and Multi-Node Ollama (Gemma 2 & DeepSeek)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "ollama>=0.4.7",
    "qdrant-client>=1.12.0",
    "chromadb>=0.5.0",
    "pypdf>=6.21.4,<7",
    "langchain-text-splitters>=0.3.0",
    "pandas==2.3.3; sys_platform == 'win32'",
    "pandas>=2.2.0; sys_platform != 'win32'",
    "openpyxl>=3.1.0",
    "transformers>=4.44.0",
    "numpy==2.2.6; sys_platform == 'win32'",
    "numpy>=1.26.0; sys_platform != 'win32'",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "google-auth[requests]>=2.41,<3",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
